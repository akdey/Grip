<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="grip-tile-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#05070c"/>
      <stop offset="100%" stop-color="#020305"/>
    </linearGradient>

    <!-- Card Edge Border -->
    <linearGradient id="grip-tile-border" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="grip-ambient-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#0284c7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#020406" stop-opacity="0"/>
    </radialGradient>

    <!-- 3D Clasp Front Face - Brushed Titanium & Obsidian -->
    <linearGradient id="clasp-metal-face" x1="140" y1="120" x2="380" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="25%" stop-color="#334155"/>
      <stop offset="65%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- 3D Clasp Extrusion Underlayer (Side Walls) -->
    <linearGradient id="clasp-metal-depth" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- 3D Chamfer Bevel Highlight (Light from top-left) -->
    <linearGradient id="clasp-bevel-light" x1="120" y1="120" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="30%" stop-color="#bfe5f7" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Rising Energy Trajectory Gradient -->
    <linearGradient id="trajectory-beam" x1="160" y1="360" x2="400" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="35%" stop-color="#0284c7"/>
      <stop offset="65%" stop-color="#06b6d4"/>
      <stop offset="90%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>

    <!-- High-Intensity Neon Glow Filter -->
    <filter id="neon-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b1"/>
      <feGaussianBlur stdDeviation="10" result="b2"/>
      <feGaussianBlur stdDeviation="20" result="b3"/>
      <feMerge>
        <feMergeNode in="b3"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 3D Heavy Drop Shadow -->
    <filter id="heavy-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Base App Tile Card with 3D Bevel -->
  <rect width="512" height="512" rx="108" fill="url(#grip-tile-bg)"/>
  <rect x="2" y="2" width="508" height="508" rx="106" stroke="url(#grip-tile-border)" stroke-width="2.5" fill="none"/>

  <!-- Center Ambient Cyan Glow -->
  <circle cx="256" cy="256" r="190" fill="url(#grip-ambient-glow)"/>

  <!-- Instrument Alignment Rings (Fine Subtle Grid) -->
  <circle cx="256" cy="256" r="176" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.35"/>
  <circle cx="256" cy="256" r="126" stroke="#0e7490" stroke-width="1" stroke-dasharray="2 6" opacity="0.25"/>

  <!-- ========================================================
       LAYER 1: THE RISING FINANCIAL TRAJECTORY (BEING GRIPPED)
       ======================================================== -->
  <g filter="url(#heavy-shadow)">
    <!-- Diffuse Trajectory Glow Aura -->
    <path
      d="M 180 344 L 226 298 L 268 326 L 372 168"
      stroke="#0284c7"
      stroke-width="32"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.22"
      filter="url(#neon-glow)"
    />

    <!-- Main Solid Trajectory Neon Beam -->
    <path
      d="M 180 344 L 226 298 L 268 326 L 372 168"
      stroke="url(#trajectory-beam)"
      stroke-width="20"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Core White High-Energy Line -->
    <path
      d="M 180 344 L 226 298 L 268 326 L 366 174"
      stroke="#ffffff"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.9"
    />

    <!-- Arrow Head (Growth Terminal) -->
    <g filter="url(#neon-glow)">
      <!-- Sharp Faceted Arrow Head -->
      <polygon
        points="328,154 394,142 382,208 360,192 344,208 328,192 344,176"
        fill="url(#trajectory-beam)"
      />
      <!-- Specular Core of Arrow -->
      <polygon
        points="346,164 384,152 376,190 364,180"
        fill="#ffffff"
        opacity="0.9"
      />
    </g>
  </g>

  <!-- ========================================================
       LAYER 2: 3D MECHANICAL CLASP "G" (DEPTH EXTRUSION WALLS)
       Offset 10px down to create true 3D physical thickness
       ======================================================== -->
  <g transform="translate(0, 10)" opacity="0.75">
    <path
      d="
        M 335 155
        C 290 110, 205 110, 160 160
        C 115 210, 115 302, 160 352
        C 205 402, 290 402, 335 362
        L 335 265
        L 255 265
        L 255 305
        L 295 305
        L 295 332
        C 265 362, 215 362, 185 328
        C 155 294, 155 224, 185 190
        C 215 156, 265 156, 300 186
        Z
      "
      fill="url(#clasp-metal-depth)"
    />
  </g>

  <!-- ========================================================
       LAYER 3: 3D MECHANICAL CLASP "G" (MAIN TITANIUM BODY)
       ======================================================== -->
  <g filter="url(#heavy-shadow)">
    <!-- Clasp Main Body Face -->
    <path
      d="
        M 335 155
        C 290 110, 205 110, 160 160
        C 115 210, 115 302, 160 352
        C 205 402, 290 402, 335 362
        L 335 265
        L 255 265
        L 255 305
        L 295 305
        L 295 332
        C 265 362, 215 362, 185 328
        C 155 294, 155 224, 185 190
        C 215 156, 265 156, 300 186
        Z
      "
      fill="url(#clasp-metal-face)"
    />

    <!-- Precision Chamfer / Beveled Perimeter Stroke -->
    <path
      d="
        M 335 155
        C 290 110, 205 110, 160 160
        C 115 210, 115 302, 160 352
        C 205 402, 290 402, 335 362
        L 335 265
        L 255 265
        L 255 305
        L 295 305
        L 295 332
        C 265 362, 215 362, 185 328
        C 155 294, 155 224, 185 190
        C 215 156, 265 156, 300 186
        Z
      "
      stroke="url(#clasp-bevel-light)"
      stroke-width="3"
      fill="none"
    />

    <!-- Upper Caliper Gripping Pad (Top Jaw Teeth) -->
    <rect x="296" y="148" width="42" height="38" rx="6" fill="#131d2e" stroke="#38bdf8" stroke-width="2"/>
    <line x1="305" y1="154" x2="305" y2="180" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="317" y1="154" x2="317" y2="180" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="329" y1="154" x2="329" y2="180" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

    <!-- Lower Vise Gripping Shelf Pad (Crossbar Clamping Surface) -->
    <rect x="250" y="260" width="50" height="48" rx="6" fill="#131d2e" stroke="#38bdf8" stroke-width="2"/>
    <line x1="262" y1="266" x2="262" y2="302" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="274" y1="266" x2="274" y2="302" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="286" y1="266" x2="286" y2="302" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

    <!-- Main Heavy-Duty Spine Hinge / Pivot Bolt -->
    <circle cx="145" cy="256" r="24" fill="#111827" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="145" cy="256" r="14" fill="#030712" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="145" cy="256" r="6" fill="#38bdf8" filter="url(#neon-glow)"/>

    <!-- Upper Calibration Rivet -->
    <circle cx="210" cy="138" r="8" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="210" cy="138" r="3" fill="#ffffff" opacity="0.6"/>

    <!-- Lower Calibration Rivet -->
    <circle cx="210" cy="378" r="8" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="210" cy="378" r="3" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- ========================================================
       LAYER 4: ACTIVE GRIP LOCK-POINTS (ENERGY COMPRESSION)
       Shows the physical vice locking onto the trajectory
       ======================================================== -->
  <!-- Upper Contact Point -->
  <g transform="translate(308, 186)" filter="url(#neon-glow)">
    <circle cx="0" cy="0" r="7" fill="#ffffff"/>
    <circle cx="0" cy="0" r="15" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Lower Contact Point -->
  <g transform="translate(262, 280)" filter="url(#neon-glow)">
    <circle cx="0" cy="0" r="7" fill="#ffffff"/>
    <circle cx="0" cy="0" r="15" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Glint / Highlight across Top Arch -->
  <path
    d="M 180 155 C 220 128, 275 128, 315 155"
    stroke="#ffffff"
    stroke-width="3.5"
    stroke-linecap="round"
    opacity="0.35"
  />
</svg>
