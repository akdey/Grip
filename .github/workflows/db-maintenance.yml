name: Database Maintenance

on:
  schedule:
    # Runs at 22:30 UTC (4:00 AM IST) daily
    - cron: '30 22 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions UI

jobs:
  db-maintenance:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd Backend
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Database Maintenance
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ENVIRONMENT: production
        run: |
          cd Backend
          python -c "
          import asyncio
          from app.core.scheduler import run_db_maintenance
          
          async def main():
              print('Starting Database Maintenance...')
              await run_db_maintenance()
              print('Database Maintenance completed successfully!')
          
          asyncio.run(main())
          "

