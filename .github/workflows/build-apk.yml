name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Backend API Base URL (e.g. https://your-backend.railway.app/api/v1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'Frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: Frontend
        run: npm ci

      - name: Build Web Application
        working-directory: Frontend
        env:
          VITE_API_BASE_URL: ${{ inputs.api_base_url || secrets.VITE_API_BASE_URL || vars.VITE_API_BASE_URL }}
          VITE_APP_NAME: ${{ vars.VITE_APP_NAME || 'Grip' }}
          VITE_APP_TAGLINE: ${{ vars.VITE_APP_TAGLINE || 'Spend smart, stress less.' }}
          VITE_APP_VERSION: '1.0.0'
        run: npm run build

      - name: Sync Web Assets to Android
        working-directory: Frontend
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        working-directory: Frontend/android
        run: chmod +x gradlew

      - name: Compile Android APK
        working-directory: Frontend/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Named APK
        run: |
          mkdir -p build-output
          cp Frontend/android/app/build/outputs/apk/debug/app-debug.apk build-output/Grip-Mobile.apk

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Grip-Mobile
          path: build-output/Grip-Mobile.apk
          retention-days: 14

      - name: Publish APK to GitHub Release (Direct Download)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: latest-mobile
          name: Grip Mobile App (Latest Build)
          body: |
            Automated Android build for Grip.
            - **Download File**: `Grip-Mobile.apk`
            - Built directly from `main`
          draft: false
          prerelease: true
          files: build-output/Grip-Mobile.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
