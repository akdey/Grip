name: Build Android APK

on:
  workflow_dispatch: # Manual 1-click trigger from GitHub Actions tab

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'Frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: Frontend
        run: npm ci

      - name: Build Web Application
        working-directory: Frontend
        run: npm run build

      - name: Sync Web Assets to Android
        working-directory: Frontend
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        working-directory: Frontend/android
        run: chmod +x gradlew

      - name: Compile Android APK
        working-directory: Frontend/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Named APK
        run: |
          mkdir -p build-output
          cp Frontend/android/app/build/outputs/apk/debug/app-debug.apk build-output/Grip-Mobile.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Grip-Mobile
          path: build-output/Grip-Mobile.apk
          retention-days: 14
